<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeCode Hub</title>
</head>
<body>
<script>
(async function(){
  var n=9, parts=[];
  for(var i=0;i<n;i++){
    var t=await (await fetch('ib'+i+'.txt')).text();
    parts.push(t.trim());
  }
  var bin=Uint8Array.from(atob(parts.join('')), function(c){return c.charCodeAt(0);});
  var html=new TextDecoder('utf-8').decode(bin);
  document.open();
  document.write(html);
  document.close();
})().catch(function(e){document.body.textContent='Load error: '+e;});
</script>
</body>
</html>
