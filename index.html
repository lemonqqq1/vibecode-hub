<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeCode Hub</title>
</head>
<body style="font-family:system-ui;padding:40px;text-align:center;color:#666">
<p>Загрузка…</p>
<script>
(async function(){
  var n=21, parts=[];
  for(var i=0;i<n;i++){
    var t=await (await fetch('x'+i+'.txt')).text();
    parts.push(t.trim());
  }
  var bin=Uint8Array.from(atob(parts.join('')), function(c){return c.charCodeAt(0);});
  var html=new TextDecoder('utf-8').decode(bin);
  document.open();
  document.write(html);
  document.close();
})().catch(function(e){
  document.body.innerHTML='<p>Ошибка загрузки: '+e+'</p>';
});
</script>
</body>
</html>
